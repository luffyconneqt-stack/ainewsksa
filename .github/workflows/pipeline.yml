# AI News KSA — autonomous content pipeline
# Runs every 8 hours (00:00, 08:00, 16:00 UTC) — 3 runs/day.
# Paired with MAX_NEW_PER_RUN=1 in pipeline.js, this caps output at 3 articles/day
# while keeping 3 chances/day to catch breaking launches. Bump frequency or
# MAX_NEW_PER_RUN back up once budget allows.
# Fetches AI news RSS → Claude generates EN + AR articles → fact-checks → commits → Cloudflare Pages auto-rebuilds

name: Content Pipeline

on:
  schedule:
    # Every 8 hours: 00:00 / 08:00 / 16:00 UTC (03:00 / 11:00 / 19:00 AST).
    - cron: "0 */8 * * *"
  # Allow manual triggering from GitHub Actions tab
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run content pipeline
        run: node scripts/pipeline.js
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}

      - name: Commit and push if changed
        run: |
          git config user.name "AI News KSA Pipeline"
          git config user.email "pipeline@ainewsksa.com"
          # Pull any remote changes first to avoid race with manual pushes
          git pull --rebase origin main || true
          git add articles/ public/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "pipeline: new articles ($(date -u +%Y-%m-%dT%H:%M:%SZ))"
          # Retry push with rebase loop in case remote drifts during our run
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, pulling with rebase and retrying..."
            git pull --rebase origin main || true
            sleep $((attempt * 3))
          done
          echo "Failed to push after 5 attempts"
          exit 1
