# AI News KSA — one-shot duplicate cleanup
# Run manually from GitHub Actions tab when you spot duplicate articles.
# Removes duplicate articles from both EN and AR sets, rebuilds site, commits.

name: Dedup Articles

on:
  workflow_dispatch:
    inputs:
      apply:
        description: "Apply changes? (false = dry run, true = remove duplicates)"
        required: true
        default: "false"
        type: choice
        options:
          - "false"
          - "true"

jobs:
  dedup:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repo
        uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: "22"

      - name: Install dependencies
        run: npm install

      - name: Run dedup script
        run: |
          if [ "${{ inputs.apply }}" = "true" ]; then
            node scripts/dedup.js --apply
            node scripts/generate.js
          else
            node scripts/dedup.js
          fi
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}

      - name: Commit changes if apply=true
        if: ${{ inputs.apply == 'true' }}
        run: |
          git config user.name "AI News KSA Dedup"
          git config user.email "dedup@ainewsksa.com"
          git pull --rebase origin main || true
          git add articles/ public/
          if git diff --staged --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git commit -m "dedup: remove duplicate articles"
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully on attempt $attempt"
              exit 0
            fi
            echo "Push attempt $attempt failed, pulling with rebase and retrying..."
            git pull --rebase origin main || true
            sleep $((attempt * 3))
          done
          exit 1
